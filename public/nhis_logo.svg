<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 180 215" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="60" y1="20" x2="150" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#29B6F6"/>
      <stop offset="45%" stopColor="#0288D1"/>
      <stop offset="100%" stopColor="#01579B"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="120" y1="80" x2="190" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#C0CA33"/>
      <stop offset="50%" stopColor="#7CB342"/>
      <stop offset="100%" stopColor="#558B2F"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="30" y1="60" x2="120" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF9800"/>
      <stop offset="100%" stopColor="#E65100"/>
    </linearGradient>
  </defs>

  <!-- 1. 햇살 및 오렌지 태양/소용돌이 -->
  <g stroke="url(#orangeGrad)" stroke-linecap="round">
    <path d="M72 58 L62 42" stroke-width="7"/>
    <path d="M92 50 L92 34" stroke-width="7"/>
    <path d="M112 54 L122 40" stroke-width="7"/>

    <path d="M 80 96 C 74 86, 88 77, 98 83 C 108 88, 107 104, 95 111 C 79 120, 61 104, 62 86 C 63 62, 91 51, 112 59 C 125 63, 133 75, 131 88" stroke-width="8" fill="none"/>
    <path d="M 48 104 C 39 130, 58 160, 88 165 C 110 168, 130 158, 142 144" stroke-width="9" fill="none"/>
  </g>

  <!-- 2. 푸른 별 (상단) -->
  <g transform="rotate(-6 130 76)">
    <path d="M 130 26 L 145 53 L 176 59 L 154 81 L 159 112 L 130 98 L 101 112 L 106 81 L 84 59 L 115 53 Z" fill="none" stroke="#0277BD" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 130 28 L 144 54 L 174 60 L 152 81 L 157 110 L 130 96 L 103 110 L 108 81 L 86 60 L 116 54 Z" fill="url(#starGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- 3. 연두빛 하트 (우측 하단) -->
  <g>
    <path d="M 168 86 C 200 84, 214 122, 196 154 C 180 178, 146 190, 116 165 C 98 149, 103 120, 130 108 C 146 102, 157 110, 168 86 Z" fill="none" stroke="#2E7D32" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 168 88 C 198 86, 211 121, 194 152 C 178 175, 146 186, 118 163 C 101 148, 106 121, 131 110 C 146 104, 157 111, 168 88 Z" fill="url(#heartGrad)" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- 4. 노인장기요양보험 국문 텍스트 -->
  <text x="130" y="222" text-anchor="middle" fill="#005BAC" font-weight="900" font-size="24" letter-spacing="-0.5px" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    노인장기요양보험
  </text>
</svg>
